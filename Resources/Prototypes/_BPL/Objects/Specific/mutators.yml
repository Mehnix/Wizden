- type: entity
  parent: PlantMutatorBase
  name: plant mutator (Harvest)
  description: makes a plant repeat-harvestable, or self-harvesting if it already repeatable.
  id: PlantMutatorHarvest
  components:
    - type: PlantMutator
      entityEffect: !type:PlantMutateHarvest

- type: entity
  parent: PlantMutatorBase
  name: plant mutator (Restore Seeds)
  description: makes a seedless plant have seeds again
  id: PlantMutatorRestoreSeeds
  components:
    - type: PlantMutator
      entityEffect: !type:PlantRestoreSeeds

