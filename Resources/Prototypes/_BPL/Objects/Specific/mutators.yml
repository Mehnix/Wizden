- type: entity
  parent: PlantMutatorBase
  name: plant mutator (kudzu)
  description: makes a plant turn into kudzu
  id: PlantMutatorKudzu
  components:
    - type: PlantMutator
      entityEffect: !type:PlantChangeTraits
        trait: PlantTraitKudzu


- type: entity
  parent: PlantMutatorBase
  name: plant mutator (lifespan)
  description: makes a plant live dramatically longer than normal.
  id: PlantMutatorLifespan
  components:
    - type: PlantMutator
      entityEffect: !type:PlantAdjustLifespan
        amount: 300

- type: entity
  parent: PlantMutatorBase
  name: plant mutator (forced growth)
  description: makes a plant immediately grow a significant amount, becoming ready to harvest faster.
  id: PlantMutatorForcedGrowth
  components:
    - type: PlantMutator
      entityEffect: !type:PlantAffectGrowth
        amount: 5

- type: entity
  parent: PlantMutatorBase
  name: plant mutator (plasma emission)
  description: makes a plant emit significant amounts of gaseous plasma.
  id: PlantMutatorPlasma
  components:
    - type: PlantMutator
      entityEffect: !type:PlantMutateExudeGases
        minValue: 5
        maxValue: 5
        gas: Plasma

