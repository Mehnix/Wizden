- type: entity
  abstract: true
  parent: BaseItem
  name: plant mutator
  description: Forces a plant to mutate into a new species, if possible.
  id: PlantMutatorBase
  components:
    - type: PlantMutator
      entityEffect: !type:PlantMutateSpeciesChange
    - type: Sprite
      sprite: _BPL/Objects/Consumable/plantmutator.rsi
      state: icon

- type: entity
  parent: PlantMutatorBase
  name: plant mutator (Species Change)
  description: Forces a plant to mutate into a new species, if possible.
  id: PlantMutatorSpecies
  components:
    - type: PlantMutator
      entityEffect: !type:PlantMutateSpeciesChange

- type: entity
  parent: PlantMutatorBase
  name: plant mutator (Potency)
  description: increases a plant's potency by 10.
  id: PlantMutatorPotency
  components:
    - type: PlantMutator
      entityEffect: !type:PlantAdjustPotency
        amount: 10

