- type: entity
  id: BaseTeleframe
  name: Abstract Teleframe
  description: Abstractly teleporting you since 2599.
  abstract: true
  components:
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Transform
    anchored: true
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.00"
        density: 200
        mask:
          - MachineMask
  - type: Sprite
    sprite: Structures/teleframe.rsi
    noRot: true
    drawdepth: HighFloorObjects
    layers:
    - state: offline
    - state: idle
      map: ["ChargeRechargeVisualState"]
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ChargeRechargeVisuals.VisualState:
        ChargeRechargeVisualState:
          On:         { state: idle, visible: true }
          Charging:   { state: beam, visible: true  }
          Recharging: { state: recharging, visible: true  }
          Off:        { state: offline, visible: false }
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
      - TeleportReceiver
  - type: Appearance
  - type: NameIdentifier
    group: CargoTelepads
  - type: AnimationPlayer
  - type: Teleframe
    blacklist: #anchored or physics-less entities are already prevented from teleporting, this is for other things
      components:
      - Singularity
      - TeslaEnergyBall
      - NoFTL
      tags:
      - TeleportImmune #not great, won't work if you hide the entity in a container.
      - Diagonal
      - Wall
      - Window
  - type: ChargeRecharge
  - type: GuideHelp
    guides:
    - Telescience

- type: entity
  id: BaseTeleframeStructure
  parent: [ BaseTeleframe, SmallConstructibleMachine, BaseMachine ]
  name: Abstract Structure Teleframe
  abstract: true
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: CollideOnAnchor
  - type: PowerConsumer #set power draw in ChargeRechargePower component. See EmitterSystem for example.
    voltage: Medium
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PointLight
    radius: 2
    energy: 2.5
    color: "#00fff2"
  - type: ChargeRechargePower
    chargingString: "examine-teleframe-charging"
    rechargingString: "examine-teleframe-recharging"
    pausedString: "examine-teleframe-recharging-paused"

- type: entity
  id: TeleframeScience
  parent: [BaseTeleframeStructure, BaseScienceContraband]
  name: experimental teleframe core
  description: The core of an advanced device that rips holes in reality for near-instanteous travel. With time and material its capabilities can be expanded. Safety not guaranteed.
  components:
  - type: Machine
    board: TeleframeScienceMachineCircuitboard
  - type: Teleframe
    teleportBeginEffect: [EffectGravityPulse]
    teleportFinishEffect: [EffectFlashBluespace]
    teleportFailEffect: [EffectTeslaSparks, EffectFlashBluespace]
    teleportModeEffects:
      Send: TeleportFromEffect
      Receive: TeleportToEffect
  - type: TeleframeIncidentLiable
    incidentChance: 0.15
  - type: ChargeRecharge
    chargeDuration: 5
    rechargeDuration: 20
  - type: LightningTarget
  - type: StaticPrice
    price: 10000

- type: entity
  id: TeleframeSyndicate
  parent: [BaseTeleframeStructure, BaseSyndicateContraband]
  name: CSTF-X infiltrator core
  description: A modification of stolen Nanotrasen blueprints to prioritise reliability and power efficiency for covert infiltration.
  components:
  - type: Teleframe
    teleportBeginEffect: [EffectGravityPulse]
    teleportFailEffect: [EffectFlashBluespace]
    teleportScatterRange: 0.5
    teleportModeEffects:
      Send: TeleportFromEffectQuiet
      Receive: TeleportToEffectQuiet
  - type: TeleframeIncidentLiable
    incidentChance: 0.05
    incidentMultiplier: 0.50
  - type: ChargeRechargePower
    powerUseActive: 5000
  - type: ChargeRecharge
    chargeDuration: 5
    rechargeDuration: 20
  - type: Sprite
    sprite: Structures/teleframe_syndicate.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: offline
    - state: idle
      map: ["ChargeRechargeVisualState"]
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 1.5
    color: "#9c0000"
  - type: StaticPrice
    price: 15000 #steal it steal it steal it steal it

- type: entity
  id: TeleframeCC
  parent: [BaseTeleframeStructure, BaseCentcommContraband]
  name: central command hyperframe core
  description: A precise tool for the uppermost echelons of Central Command, allowing for rapid deployment and extraction of critical assets. Exceptionally Expensive.
  components:
  - type: Teleframe
    teleportScatterRange: 0.25
    teleportRadius: 0.45
    teleportFailEffect: [EffectFlashBluespace]
    teleportModeEffects:
      Send: TeleportFromEffect
      Receive: TeleportToEffect
  - type: ChargeRechargePower
    powerUseActive: 1000
  - type: ChargeRecharge
    chargeDuration: 1
    rechargeDuration: 1
  - type: Sprite
    sprite: Structures/teleframe.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: offline_cc
    - state: idle
      map: ["ChargeRechargeVisualState"]
      shader: unshaded
  - type: StaticPrice
    price: 50000 #steal it steal it steal it steal it

- type: entity
  id: TeleframeMoff
  parent: TeleframeCC
  name: mothroachframe
  suffix: Admeme
  description: This is beyond science.
  components:
  - type: Teleframe
    teleportBeginEffect: [EffectGravityPulse] #so can these but they don't delete themselves automatically
    teleportFinishEffect: [EffectFlashBluespace, EffectGravityPulse]
    teleportScatterRange: 0.25
    teleportRadius: 1
    teleportFailEffect: [EffectFlashBluespace]
    teleportModeEffects:
      Send: MobMothroach #these entities can be anything that doesn't despawn too quickly
      Receive: MobMothroach #they'll delete themselves after teleportation concludes
  - type: ChargeRecharge
    chargeDuration: 5
    rechargeDuration: 5
