- type: entity
  parent: [ BaseStructureDynamic, StructureHealthDoorWeak ]
  id: FirelockFrame
  name: firelock frame
  description: That is a firelock frame.
  components:
  - type: Sprite
  # Classic: Respritening renamed.
    sprite: Structures/Doors/Airlocks/Standard/firelock.rsi
    layers:
  # Classic: Added back frame 1 state.
    - state: frame1
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: Construction
    graph: Firelock
    node: frame1
  - type: InteractionOutline
  - type: RCDDeconstructable
    cost: 4
    delay: 6
    fx: EffectRCDDeconstruct6
  - type: Damageable
    damageModifierSet: PlasteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - Impassable
        - HighImpassable
        layer:
        - HighImpassable
        - MidImpassable
  # Classic: readded visualizer removed by Respritening.
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          frame1: { state: frame1 }
          frame2: { state: frame2 }
          frame3: { state: frame3 }
          frame4: { state: frame4 }
