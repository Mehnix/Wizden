- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersBasic #lootbox triggers should require the player to DO something to it. Avoid accidental openings.
  weights:
    TriggerInteractParticle: 1000
    TriggerScrewing: 1
    TriggerPrying: 1
    TriggerWrenching: 1
    TriggerPulsing: 1
    TriggerBruteDamageMinor: 1
    TriggerWater: 1
    TriggerBlood: 1
    TriggerDeath: 0.5 #exception as the lootbox demanding a sacrifice is funny

- type: xenoArchTrigger
  id: TriggerBruteDamageMinor
  tip: xenoarch-trigger-tip-brute-damage
  components:
  - type: XATDamageThresholdReached
    groupsNeeded:
      Brute: 5 #uses metallic structure damage set so stuff like crowbars will do nothing
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-brute-damage

- type: xenoArchTrigger #interact and destroy interacting object
  id: TriggerInteractCoin
  tip: xenoarch-trigger-tip-coin
  components:
  - type: XATInteractWith
    destroyAfter: true
    triggerSound: /Audio/Items/pistol_magin.ogg
    whitelist:
      tags:
      - Coin
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-coin

- type: xenoArchTrigger
  id: TriggerInteractTechdisk
  parent: TriggerInteractCoin
  tip: xenoarch-trigger-tip-techdisk
  components:
  - type: XATInteractWith
    whitelist:
      tags:
      - TechnologyDisk
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-techdisk

