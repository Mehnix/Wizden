- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersBasic #lootbox triggers should require the player to DO something to it. Avoid accidental openings.
  weights:
    TriggerScrewing: 1 #these ones already have a description so can just use them as is
    TriggerPrying: 1
    TriggerWrenching: 1
    TriggerPulsing: 1
    LootboxTriggerWater: 1
    LootboxTriggerBlood: 1
    LootboxTriggerBruteDamageMinor: 1
    LootboxTriggerInteractStamp: 1
    LootboxTriggerDeath: 0.2 #exception as the lootbox demanding a sacrifice is funny

- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersEngineering
  weights:
    #LootboxTriggerAccessCE: 1
    LootboxTriggerHeat: 1
    LootboxTriggerPressureHigh: 1
    LootboxTriggerPlasma: 1
    LootboxTriggerTritium: 0.5
    LootboxTriggerInteractShock: 1
    LootboxTriggerAttackParticleEngine: 1

- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersSecurity
  weights:
    #LootboxTriggerAccessHOS: 1
    LootboxTriggerInteractCuffs: 1
    LootboxTriggerAttackStaminaDamage: 1
    LootboxTriggerAttackLaser: 1

- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersMedical
  weights:
    #LootboxTriggerAccessCMO: 1
    LootboxTriggerBlood: 1
    LootboxTriggerShock: 1
    LootboxTriggerInteractTopical: 1
    #TriggerReactiveReagentEasy: 1 # reagent triggers have their own description. (requires reagent trigger PR)
    #TriggerReactiveReagentHard: 1
    #TriggerReagentSpecificObscure: 1

- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersScience
  weights: #science are already good at artifact triggers so they get some of the rest too
    #LootboxTriggerAccessRD: 1
    LootboxTriggerBlood: 1
    LootboxTriggerPlasma: 1
    LootboxTriggerHeat: 1
    LootboxTriggerPressureHigh: 1
    LootboxTriggerInteractScan: 1
    LootboxTriggerConsumeKnowledge: 1
    LootboxTriggerConsumeCarbs: 1
    LootboxTriggerAttackParticleAnomaly: 1
    LootboxTriggerAttackLaser: 1
    #TriggerReagentSpecificObscure: 1 # reagent triggers have their own description.

- type: weightedRandomXenoArchTrigger
  id: LootboxTriggersService
  weights:
    #LootboxTriggerAccessHOP: 1
    LootboxTriggerConsumeCarbs: 1
    LootboxTriggerConsumeFruit: 0.5
    LootboxTriggerConsumeMushroom: 0.5
    LootboxTriggerConsumeMeat: 1
    LootboxTriggerAttackPie: 1
    #TriggerReactiveDrinkEasy: 1 # reagent triggers have their own description.
    #TriggerReactiveDrinkHard: 1

# A lot of duplicated triggers that add examinable text
# examinable text is needed for lootbox triggers as you can't and shouldn't scan the lootbox at an artifact analyzer.
# examinable text on the base arti triggers themselves doesn't add anything useful as it'll just stack them all for each activateble node. Just ends up being confusing.

- type: entity
  id: LootboxTriggerBruteDamageMinor
  tip: xenoarch-trigger-tip-brute-damage #uses metallic structure damage set so stuff like crowbars will do nothing, hit it with something that does structure damage.
  components:
  - type: XATDamageThresholdReached
    groupsNeeded:
      Brute: 5
  - type: XATExaminableText
    examineText: lootbox-trigger-examine-brute-damage

- type: entity
  id: LootboxTriggerWater
  parent: TriggerWater
  tip: xenoarch-trigger-tip-water
  components:
  - type: XATExaminableText
    examineText: lootbox-trigger-examine-water

- type: entity
  id: LootboxTriggerBlood
