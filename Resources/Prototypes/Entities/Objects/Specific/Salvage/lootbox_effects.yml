- type: entityTable
  id: LootboxResultBasic
  table: !type:GroupSelector
    children:
    - id: LootboxEffectConvert

- type: entityTable
  id: LootboxTableBasic #the meat of the lootbox, should be consistently worth the effort with occasional bangers
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: FillSmugglerBackpack
    - !type:NestedSelector
      tableId: SalvageScrapHighValue
      rolls: 2, 4
    - !type:NestedSelector
      tableId: RandomAllHighValueConstructionMaterialsTable
    - !type:NestedSelector
      tableId: RandomAllHighValueMaterialsTable
    - !type:NestedSelector
      tableId: InsulsTable
    - !type:NestedSelector
      tableId: SalvageTreasureSpawnerValuable
    - !type:NestedSelector
      tableId: LotteryCashEntityTable
      rolls: 1, 2

- type: entityTable
  id: LootboxTableUseless #the potatos of the lootbox, not strictly all useless, but clearly secondary.
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MaintFluffTable
      rolls: 3, 5
    - !type:NestedSelector
      tableId: AllToysTable
      rolls: 1, 2
    - !type:NestedSelector
      tableId: AllPlushiesTable
      rolls: 1, 2
    - !type:NestedSelector
      tableId: LotterySwagEntityTable
      weight: 0.25
    - !type:NestedSelector
      tableId: RandomInstrumentTable
    - !type:NestedSelector
      tableId: RandomAllAlcoholTable
      rolls: 1, 2
    - !type:NestedSelector
      tableId: TreasureCoinPile # these really don't sell for much in the grand scheme of things.
      rolls: 3, 5
    - !type:NestedSelector
      tableId: SmallCritterEntityTable
    - id: MysteryFigureBox
      amount: !type:RangeNumberSelector
        range: 1, 2

