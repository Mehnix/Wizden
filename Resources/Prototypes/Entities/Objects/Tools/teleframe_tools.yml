- type: entity
  id: BaseTeleportBeacon #for items that can act as beacons
  abstract: true
  components:
    - type: TeleframeBeacon
    - type: NameIdentifier
      group: CargoTelepads
    - type: DeviceList
    - type: DeviceNetwork
      deviceNetId: Wired
      receiveFrequencyId: BasicDevice
    - type: DeviceLinkSource
      range: 20000 #can't link across different maps but should be able to function once set up?
      ports:
        - TeleportBeaconSender
    - type: GuideHelp
      guides:
      - Telescience

- type: entity
  id: TeleportBeacon
  parent: [ BaseTeleportBeacon, BaseItem ]
  name: teleport beacon
  description: Can be linked to a teleframe console, allowing it to be targeted over any distance. Can be anchored by hand.
  components:
    - type: Item
      size: Small
      inhandVisuals:
        left:
        - state: inhand-left
        right:
        - state: inhand-right
    - type: Anchorable
      delay: 0.5
    - type: QuickAnchor
    - type: TeleframeBeacon
      ValidBeacon: false
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.AnchorVisuals.Anchored:
          anchorLayer:
            True: { state: icon_anchored }
            False: { state: icon}
    - type: Sprite
      sprite: Objects/Specific/Research/teleportbeacon.rsi
      drawdepth: SmallObjects
      layers:
        - state: icon
          map: [ "anchorLayer" ]

- type: entity
  id: TeleportBeaconAnchored #teleport beacon that can be placed pre-anchored in the map editor
  parent: TeleportBeacon
  name: teleport beacon
  suffix: Anchored
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    layers:
      - state: icon_anchored
        map: [ "anchorLayer" ]

- type: entity
  name: handheld teleframe console
  parent: [BaseHandheldComputer, BaseTeleportBeacon]
  id: HandHeldTeleframeConsole
  description: A miniaturised teleframe console with built-in GPS and teleport beacon.
  components:
  - type: Item
    sprite: Objects/Tools/handheld_teleframe_console.rsi
    size: Normal
  - type: Sprite
    sprite: Objects/Tools/handheld_teleframe_console.rsi
    state: icon
    layers:
      - state: icon
      - state: scanner
        shader: unshaded
        visible: false
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: { visible: true }
          Neither: { visible: true }
          Empty: { visible: false }
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 10
    ports:
      - TeleportSender
      - TeleportBeaconSender
  - type: DeviceLinkSink
    ports:
      - TeleportBeaconReceiver
  - type: TeleframeConsole
    maxRange: 50000
    announcementChannel: Science
  - type: ActivatableUI
    key: enum.TeleframeConsoleUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.TeleframeConsoleUiKey.Key:
        type: TeleframeConsoleBoundUserInterface
  - type: Speech
    speechVerb: Robotic
  - type: PowerCellDraw
    drawRate: 1.5
  - type: ToggleCellDraw
  - type: StaticPrice
    price: 200
  - type: TeleframeConsoleRadio
    announcementChannel: Science
    speakIc: true
  - type: ActiveRadio
    channels:
    - Science
  - type: HandheldGPS

- type: entity
  name: handheld teleframe console
  parent: HandHeldTeleframeConsole
  id: HandHeldTeleframeConsoleEmpty
  description: A miniaturised teleframe console with built-in teleport beacon.
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  name: handheld teleframe
  parent: [BaseHandheldComputer, BaseCentcommContraband]
  id: HandHeldTeleframe
  suffix: Admeme
  description: A miniaturised teleframe for the highest of Central Command. A key to practically anywhere.
  components:
  - type: Item
    sprite: Objects/Devices/signaller.rsi
    size: Normal
  - type: Sprite
    sprite: Objects/Devices/signaller.rsi
    state: advanced
    layers:
      - state: advanced
  - type: TeleframeConsole
    maxRange: 50000
  - type: TeleframeConsoleRadio
    announcementChannel: CentCom
    speakIc: true
  - type: ActivatableUI
    key: enum.TeleframeConsoleUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.TeleframeConsoleUiKey.Key:
        type: TeleframeConsoleBoundUserInterface
  - type: Speech
    speechVerb: Robotic
  - type: StaticPrice
    price: 20000
  - type: ActiveRadio
    channels:
    - CentCom
  - type: HandheldGPS
  - type: Teleframe
    teleportScatterRange: 0.25
    teleportRadius: 0.45
    teleportFailEffect: [EffectFlashBluespace]
    teleportModeEffects:
      Send: TeleportFromEffect
      Receive: TeleportToEffect
  - type: ChargeRecharge
    chargeDuration: 0.5
    rechargeDuration: 1

- type: entity
  name: bluespace depth charge
  id: BluespaceDepthcharge
  parent: BaseItem
  description: A football-sized sensor device that can survive the rigors of teleportation and collect data in the depths of unreality.
               It needs to be returned for analysis at the science department's research servers. Maybe you could help it along that journey.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/teleportcharge.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    #- state: fuel
    #  shader: unshaded
      #map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Appearance
#  - type: GenericVisualizer
#    visuals:
#      enum.TeleChargeVisuals.State:
#        burnLayer:
#          True: { visible: true }
#          False: { visible: false }
  - type: Speech
    speechVerb: Robotic
  - type: Telecharge
    announcementChannel: Science
    whitelist:
      components:
      - TelescienceFracture

- type: entity
  id: RealityFracture
  name: reality fracture
  description: A malformed tear in the fabric of reality that failed to manifest as a true anomaly.
              Peering beyond the veil within its presence may yield scientific insights, or madness.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    bodyStatus: InAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Sprite
    sprite: Objects/Magic/Eldritch/reality_fracture.rsi
    drawdepth: Effects #it needs to draw over stuff.
    layers:
    - state: icon
      map: ["enum.AnomalyVisualLayers.Base"]
    - state: icon_harvested
      map: ["enum.AnomalyVisualLayers.Animated"]
      visible: false
  - type: PointLight
    radius: 1.5
    energy: 12.5
    color: "#793a80"
  - type: TelescienceFracture
    minHealthRoll: 15000
    maxHealthRoll: 30000
  - type: Anomaly
    pulseVariation: 0
    healthChangePerSecond: -0.025
    pulseStabilityVariation: 0,0
    decayThreshold: -1
    growthThreshold: 10
    corePrototype: ShardSpawner
    supercriticalSoundAtAnimationStart:
      collection: AnomalyBluespaceSupercritical
    pulseSound:
      collection: RadiationPulse
      params:
        volume: 5
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
  - type: Appearance
  - type: AnimationPlayer
  - type: SecretDataAnomaly
    randomStartSecretMin: 0
    randomStartSecretMax: 2
  - type: DamageOnInteract
    damage:
      types:
        Radiation: 10
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Radiation: 10

- type: entity
  id: BaseAnomalousShard
  parent: BaseXenoArtifactItem
  name: anomalous shard
  description: A shard of an anomalous object, still retaining some ability to channel strange effects.
  components:
  - type: XenoArtifact
    nodeCount:
      min: 1
      max: 1
    segmentSize:
      min: 1
      max: 1
    nodesPerSegmentLayer:
      min: 1
      max: 1
    scatterPerLayer:
      min: 0
      max: 0
    effectsTable: !type:GroupSelector
      children:
      - !type:NestedSelector
        tableId: AnomalousShardEffectsTable
        weight: 1
    triggerWeights: AnomalousShardTriggers
  - type: Item
    size: Normal

- type: entityTable
  id: AnomalousShardEffectsTable
  table: !type:GroupSelector
    children:
    - id: XenoArtifactGun

- type: weightedRandomXenoArchTrigger
  id: AnomalousShardTriggers
  weights:
    TriggerExamine: 1

- type: entity
  id: ShardSpawner
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:GroupSelector
        children:
        - id: BaseAnomalousShard
          amount: !type:RangeNumberSelector
            range: 1, 5
