- type: entity
  id: BaseTeleportBeacon #for items that can act as beacons
  abstract: true
  components:
    - type: TeleframeBeacon
    - type: NameIdentifier
      group: CargoTelepads
    - type: DeviceList
    - type: DeviceNetwork
      deviceNetId: Wired
      receiveFrequencyId: BasicDevice
    - type: DeviceLinkSource
      range: 20000 #can't link across different maps but should be able to function once set up?
      ports:
        - TeleportBeaconSender
    - type: GuideHelp
      guides:
      - Telescience

- type: entity
  id: TeleportBeacon
  parent: [ BaseTeleportBeacon, BaseItem ]
  name: teleport beacon
  description: Can be linked to a teleframe console, allowing it to be targeted over any distance. Can be anchored by hand.
  components:
    - type: Item
      size: Small
      inhandVisuals:
        left:
        - state: inhand-left
        right:
        - state: inhand-right
    - type: Anchorable
      delay: 0.5
    - type: QuickAnchor
    - type: TeleframeBeacon
      ValidBeacon: false
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.AnchorVisuals.Anchored:
          anchorLayer:
            True: { state: icon_anchored }
            False: { state: icon}
    - type: Sprite
      sprite: Objects/Specific/Research/teleportbeacon.rsi
      drawdepth: SmallObjects
      noRot: true
      layers:
        - state: icon
          map: [ "anchorLayer" ]

- type: entity
  id: TeleportBeaconAnchored #teleport beacon that can be placed pre-anchored in the map editor
  parent: TeleportBeacon
  name: teleport beacon
  suffix: Anchored
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    layers:
      - state: icon_anchored
        map: [ "anchorLayer" ]

- type: entity
  name: handheld teleframe console
  parent: [BaseHandheldComputer, BaseTeleportBeacon]
  id: HandHeldTeleframeConsole
  description: A miniaturised teleframe console with built-in GPS and teleport beacon.
  components:
  - type: Item
    sprite: Objects/Tools/handheld_teleframe_console.rsi
    size: Normal
  - type: Sprite
    sprite: Objects/Tools/handheld_teleframe_console.rsi
    state: icon
    layers:
      - state: icon
      - state: scanner
        shader: unshaded
        visible: false
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: { visible: true }
          Neither: { visible: true }
          Empty: { visible: false }
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 10
    ports:
      - TeleportSender
      - TeleportBeaconSender
  - type: DeviceLinkSink
    ports:
      - TeleportBeaconReceiver
  - type: TeleframeConsole
    maxRange: 50000
    announcementChannel: Science
  - type: ActivatableUI
    key: enum.TeleframeConsoleUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.TeleframeConsoleUiKey.Key:
        type: TeleframeConsoleBoundUserInterface
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Speech
    speechVerb: Robotic
  - type: PowerCellDraw
    drawRate: 1.5
  - type: ToggleCellDraw
  - type: StaticPrice
    price: 200
  - type: TeleframeConsoleRadio
    announcementChannel: Science
    speakIc: true
  - type: ActiveRadio
    channels:
    - Science
  - type: HandheldGPS

- type: entity
  name: handheld teleframe console
  parent: HandHeldTeleframeConsole
  id: HandHeldTeleframeConsoleEmpty
  description: A miniaturised teleframe console with built-in teleport beacon.
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  name: handheld teleframe
  parent: [BaseHandheldComputer, BaseCentcommContraband]
  id: HandHeldTeleframe
  suffix: Admeme
  description: A key to anywhere.
  components:
  - type: Item
    sprite: Objects/Devices/signaller.rsi
    size: Normal
  - type: Sprite
    sprite: Objects/Devices/signaller.rsi
    state: advanced
    layers:
      - state: icon
  - type: Appearance
  - type: TeleframeConsole
    maxRange: 50000
    announcementChannel: CentCom
  - type: TeleframeConsoleRadio
    announcementChannel: CentCom
    speakIc: true
  - type: ActivatableUI
    key: enum.TeleframeConsoleUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.TeleframeConsoleUiKey.Key:
        type: TeleframeConsoleBoundUserInterface
  - type: Speech
    speechVerb: Robotic
  - type: StaticPrice
    price: 20000
  - type: ActiveRadio
    channels:
    - CentCom
  - type: HandheldGPS
  - type: Teleframe
    teleportScatterRange: 0.25
    teleportRadius: 0.45
    teleportBeginEffect: [EffectGravityPulse]
    teleportFinishEffect: [EffectGravityPulse]
    teleportFailEffect: [EffectFlashBluespace]
    teleportModeEffects:
      Send: TeleportFromEffect
      Receive: TeleportToEffect
  - type: ChargeRecharge
    chargeDuration: 0.5
    rechargeDuration: 1

- type: entity
  name: bluespace depth charge
  parent: BaseItem
  id: TeleportCharge
  description: A football-sized sensor device that can survive the rigors of teleportation and collect data on fractures in reality.
               It requires someone to return it to the science department afterwards for analysis, perhaps that could be you.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/teleportcharge.rsi
    drawdepth: SmallObjects
    noRot: true
    layers:
    - state: icon
    #- state: fuel
    #  shader: unshaded
      #map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Appearance
#  - type: GenericVisualizer
#    visuals:
#      enum.TeleChargeVisuals.State:
#        burnLayer:
#          True: { visible: true }
#          False: { visible: false }
  - type: Speech
    speechVerb: Robotic
  - type: Telecharge
    announcementChannel: Science
    whitelist:
      components:
      - TelescienceFracture

- type: entity
  id: RealityFracture
  name: reality fracture
  description: A malformed tear in the fabric in reality that failed to manifest as a true anomaly.
              Peering beyond the veil within its presence may yield scientific insights, or madness.
  components:
  - type: Transform
    anchored: True
  - type: Physics
    bodyType: Static
    bodyStatus: InAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
  - type: Appearance
  - type: AnimationPlayer
  - type: Sprite
    sprite: Objects/Magic/Eldritch/reality_fracture.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: icon
  - type: PointLight
    radius: 1.5
    energy: 12.5
    color: "#793a80"
  - type: TelescienceFracture
    minHealthRoll: 15000
    maxHealthRoll: 30000
