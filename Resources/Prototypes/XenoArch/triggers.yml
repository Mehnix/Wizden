- type: xenoArchTrigger
  id: TriggerInteractStamp
  tip: xenoarch-trigger-tip-stamp
  components:
  - type: XATInteractWith
    interactionTime: 0.5
    successTriggerSound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
    whitelist:
      components:
      - Stamp

- type: xenoArchTrigger
  id: TriggerInteractDefib
  tip: xenoarch-trigger-tip-defib
  components:
  - type: XATInteractWith
    startTriggerSound: /Audio/Items/Defib/defib_charge.ogg
    successTriggerSound: /Audio/Items/Defib/defib_zap.ogg
    interactionTime: 3
    whitelist:
      components:
      - Defibrillator

- type: xenoArchTrigger
  id: TriggerInteractScanning
  tip: xenoarch-trigger-tip-scanning
  components:
  - type: XATInteractWith
    successTriggerSound: /Audio/Items/Medical/healthscanner.ogg
    interactionTime: 1.5
    whitelist:
      components: # Node scanner doesn't work due to interaction priorities.
      - AnomalyScanner
      - ForensicScanner
      - TrayScanner
      - RadarConsole # Mass Scanner

