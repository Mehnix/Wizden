- type: xenoArchTrigger
  id: TriggerConsumeTechdisk
  tip: xenoarch-trigger-tip-techdisk
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - TechnologyDisk

- type: xenoArchTrigger
  id: TriggerConsumeMoney
  tip: xenoarch-trigger-tip-money
  components:
  - type: XATInteractWith
    interactionCount:
      min: 100
      max: 200
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - Cash

- type: xenoArchTrigger
  id: TriggerConsumePizza
  tip: xenoarch-trigger-tip-pizza
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound:
      collection: eating
      params:
        volume: 5
    whitelist:
      tags:
      - Pizza

