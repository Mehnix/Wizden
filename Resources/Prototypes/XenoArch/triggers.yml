- type: weightedRandomXenoArchTrigger
  id: DefaultTriggers
  weights:
    TriggerMusic: 1
    TriggerHeat: 1
    TriggerCold: 0.5
    TriggerNoOxygen: 1
    TriggerNoNitrogen: 0.5
    TriggerWater: 1
    TriggerCO2: 0.5
    TriggerPlasma: 0.5
    TriggerN2O: 0.5
    TriggerTritium: 0.1
    TriggerAmmonia: 0.1
    TriggerFrezon: 0.1
    TriggerRadiation: 1
    TriggerPressureHigh: 0.5
    TriggerPressureLow: 1
    TriggerExamine: 1
    TriggerBruteDamage: 1
    TriggerBurnDamage: 1
    #TriggerInteraction: 1 #this one interferes with activating artifact AND brute dmg!
    TriggerWrenching: 0.5
    TriggerPrying: 0.5
    TriggerScrewing: 0.5
    TriggerPulsing: 0.5
    TriggerWelding: 0.5
    TriggerSlicing: 0.5
    TriggerCutting: 0.5
    TriggerHonking: 0.5
    TriggerTimer: 0.25
    TriggerBlood: 1
    TriggerThrow: 1
    TriggerDeath: 1
    TriggerMagnet: 1
    TriggerConsumeMoney: 0.5
    TriggerConsumeTechdisk: 0.5
    TriggerConsumePizza: 0.5
    TriggerConsumeCake: 0.5
    TriggerConsumeProduce: 1
    TriggerInteractStamp: 1
    TriggerInteractDefib: 1
    TriggerInteractScanning: 0.5
    TriggerFlash: 1
    TriggerAttackParticleEngine: 0.25
    TriggerAttackParticleAnomaly: 1
    TriggerAttackStaminaDamage: 1
    TriggerReactiveDrinkEasy: 1
    TriggerReactiveDrinkHard: 0.5
    TriggerReactiveReagentEasy: 1
    TriggerReactiveReagentHard: 0.5
    TriggerReactiveReagentObscure: 0.5
    TriggerEmoteDistress: 1
    TriggerEmoteHumour: 1
    TriggerAccessCommand: 0.5

- type: xenoArchTrigger
  id: TriggerMusic
  tip: xenoarch-trigger-tip-music
  components:
  - type: XATCompNearby
    requireComponentWithName: ActiveInstrument
    radius: 2

- type: xenoArchTrigger
  id: TriggerHeat
  tip: xenoarch-trigger-tip-heat
  components:
  - type: XATTemperature
    targetTemperature: 373
    triggerOnHigherTemp: true
  - type: XATDamageThresholdReached
    typesNeeded:
      Heat: 20
# This kinda trivializes the difficulty.
#  - type: XATToolUse
#    requiredTool: Welding
#    delay: 5
#    fuel: 10

- type: xenoArchTrigger
  id: TriggerCold
  tip: xenoarch-trigger-tip-cold
  components:
  - type: XATTemperature
    targetTemperature: 255
    triggerOnHigherTemp: false
  - type: XATDamageThresholdReached
    typesNeeded:
      Cold: 20

- type: xenoArchTrigger
  id: TriggerNoOxygen
  tip: xenoarch-trigger-tip-no-oxygen
  components:
  - type: XATGas
    targetGas: Oxygen
    moles: 10
    shouldBePresent: false

- type: xenoArchTrigger
  id: TriggerNoNitrogen
  tip: xenoarch-trigger-tip-no-nitrogen
  components:
  - type: XATGas
    targetGas: Nitrogen
